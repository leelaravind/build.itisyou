name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.22.0'

jobs:
  # Fast feedback. Everything that needs no browser and no database.
  verify:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Working tree only. A secret that was committed and later removed still lives in history
      # and needs rotation - this job cannot detect that and must not imply otherwise.
      - name: Secret scan
        run: pnpm scan:secrets

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=moderate

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build
        run: pnpm build

      - name: Run E2E suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ADR-0002 records an accepted limitation: PGlite is single-connection, so it cannot exercise
  # connection pooling or concurrent-writer contention. Those suites therefore must also run against
  # a real networked Postgres before anything is promoted to staging.
  #
  # This job is a placeholder until Phase 3 introduces the schema. It is defined now, with the
  # service already wired, so the requirement cannot be quietly forgotten once tests exist.
  concurrency-postgres:
    name: Concurrency suites against networked Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govintel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Concurrency suites
        env:
          # Throwaway credential for the ephemeral service container above: created and destroyed
          # within this job, reaching nothing outside it.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/govintel_test # secret-scan-ignore
        run: |
          if pnpm vitest list --project=concurrency >/dev/null 2>&1; then
            pnpm vitest run --project=concurrency
          else
            echo "No concurrency suite yet - introduced in Phase 3 with the schema."
            echo "Postgres service is wired and reachable, so the suite can run the moment it exists."
          fi
