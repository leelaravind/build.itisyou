name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.22.0'

jobs:
  # Fast feedback. Everything that needs no browser and no database.
  verify:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A hand-maintained authorisation matrix drifts from the code, and a drifted security
      # document is worse than none - it tells a reviewer the system behaves one way while it
      # behaves another.
      - name: Permissions matrix is current
        run: pnpm docs:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Working tree only. A secret that was committed and later removed still lives in history
      # and needs rotation - this job cannot detect that and must not imply otherwise.
      - name: Secret scan
        run: pnpm scan:secrets

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=moderate

  # Sharded, because the suite outgrew one runner.
  #
  # 1,265 tests across five browsers stopped fitting in the 30-minute cap: the run at bf291a5 was
  # killed with tests still queued, having spent about eleven minutes on setup before the first one
  # started. A larger timeout would have hidden that — the cap is what makes a suite that has quietly
  # grown by half visible — so the work is split instead and the cap stays where it is.
  #
  # Four shards, not more. Every shard pays the setup cost again, and at four the setup is already
  # about half of each job, so the next one buys less wall-clock than it costs in runner minutes.
  e2e:
    name: End-to-end and accessibility (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failure in one shard says nothing about the others, and cancelling them throws away the
      # evidence of whether the failure is local to one spec or general.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # No separate build step. `playwright.config.ts` builds before it starts the server — on
      # purpose, so a spec can never run against a stale artefact — and the `verify` job already
      # builds independently. Building here as well cost every shard a full Next build for nothing.
      - name: Run E2E suite
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # ADR-0002 records an accepted limitation: PGlite is single-connection, so it cannot exercise
  # connection pooling or concurrent-writer contention. Those suites therefore must also run against
  # a real networked Postgres before anything is promoted to staging.
  #
  # This job is a placeholder until Phase 3 introduces the schema. It is defined now, with the
  # service already wired, so the requirement cannot be quietly forgotten once tests exist.
  concurrency-postgres:
    name: Concurrency suites against networked Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govintel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The gate that PGlite cannot run.
      #
      # `packages/db/test/tenant-scope.test.ts` covers tenant isolation and is structurally incapable
      # of catching the bug it was written for: PGlite is one connection behind a mutex, so a leaked
      # scope has nowhere to leak to. The discriminating condition is a pool, which needs a real
      # server — and there is one right here, in the service container above.
      #
      # Measured against the pre-fix implementation on a four-connection pool, the interleaving check
      # returned 18 of 40 requests carrying **another tenant's row**. This job is what keeps that from
      # being a story about one afternoon.
      # Applied as the owner, which then creates the restricted role the application will use.
      #
      # `APP_ROLE_PASSWORD` gives `govintel_app` a LOGIN so the next step can connect **as** it.
      # Throwaway, like the owner credential above: both belong to a service container created and
      # destroyed inside this job, reaching nothing outside it.
      - name: Apply the schema and create the restricted application role
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/govintel_test # secret-scan-ignore
          APP_ROLE_PASSWORD: ci-throwaway-role-password-for-an-ephemeral-container # secret-scan-ignore
        run: pnpm migrate

      # Connects as `govintel_app`, not as the container's `postgres` superuser.
      #
      # This is the arrangement production runs, and CI has to match it or the check tests something
      # nobody deploys. It also has teeth: when this job still connected as `postgres`, the gate
      # failed — correctly — because a superuser that owns every table bypasses RLS unconditionally,
      # which is SEC-001. Passing while connected as a superuser would have proved only that the
      # queries were written correctly, not that the policies do anything.
      - name: Tenant isolation under a real pool, as the restricted role
        env:
          APP_ENV: staging
          DATABASE_URL_UNPOOLED: postgresql://govintel_app:ci-throwaway-role-password-for-an-ephemeral-container@localhost:5432/govintel_test # secret-scan-ignore
        run: pnpm verify:isolation

      - name: Concurrency suites
        env:
          # Throwaway credential for the ephemeral service container above: created and destroyed
          # within this job, reaching nothing outside it.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/govintel_test # secret-scan-ignore
        run: |
          if pnpm vitest list --project=concurrency >/dev/null 2>&1; then
            pnpm vitest run --project=concurrency
          else
            echo "No concurrency suite yet - introduced in Phase 3 with the schema."
            echo "Postgres service is wired and reachable, so the suite can run the moment it exists."
          fi

  cloudflare-build:
    name: Cloudflare Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The deployable artefact, built rather than assumed.
      #
      # This job exists because the OpenNext bundler creates symlinks, which Windows refuses without
      # Developer Mode or Administrator — so the build cannot be verified on a developer's machine
      # here (KI-051). It is an environment constraint rather than a defect, and the honest response
      # is to verify it somewhere that can, on every push, rather than to claim it works.
      #
      # `APP_ENV` is deliberately NOT set here.
      #
      # It was, and it is why this job failed on its first real run: with `APP_ENV=staging`,
      # `parseEnv()` requires `DATABASE_URL` and `SESSION_SECRET`, and `next build` evaluates route
      # modules to collect page data — so the build died on `/api/health` with
      # *"Environment validation failed for: DATABASE_URL, SESSION_SECRET"* on a runner that has
      # neither and should not need either.
      #
      # That is the `NODE_ENV` / `APP_ENV` distinction `packages/shared/src/env.ts` exists to draw,
      # reintroduced from the other side. `NODE_ENV` answers "is this optimised?" and belongs to the
      # build; `APP_ENV` answers "which environment is this serving?" and belongs to the deployment.
      # A build that needs to know which environment will run it is a build that cannot be promoted,
      # and promoting one artefact through stages is the whole point of the pipeline.
      #
      # The deployed Worker gets `APP_ENV` from `[env.*.vars]` in wrangler.toml, at runtime, where it
      # is true.
      - name: Build the Next.js Worker (OpenNext)
        run: pnpm --filter=@govintel/web cf:build

      # Compiles the Worker and resolves every binding without contacting an account. Catches a
      # wrangler.toml that references a binding the code does not use, or a handler signature the
      # runtime will not accept.
      - name: Validate the outbox Worker
        run: pnpm exec wrangler deploy --dry-run --outdir="${RUNNER_TEMP}/worker-bundle" --env=""
        working-directory: apps/worker
