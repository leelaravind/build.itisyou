# The outbox drainer and queue consumer.
#
# A separate Worker from the application. OpenNext owns the entry point of the Next.js Worker, and
# adding `scheduled` and `queue` handlers to a generated entry means fighting the generator on every
# upgrade. Two Workers sharing `packages/*` is the arrangement that survives somebody else's upgrade.
#
# See docs/CLOUDFLARE_DEPLOYMENT_ARCHITECTURE.md §5.
#
# ---------------------------------------------------------------------------
# Why every binding is repeated under each environment
# ---------------------------------------------------------------------------
#
# Wrangler environments do **not** inherit top-level bindings. `[[hyperdrive]]`, `[[queues.*]]` and
# `[triggers]` declared at the top of this file apply to the environment-less deployment and to
# nothing else, so a Worker deployed with `--env staging` against the earlier version of this file
# would have started with no database binding, no queue and no cron — and the first symptom would
# have been a `scheduled` handler reading `env.HYPERDRIVE.connectionString` off `undefined` once a
# minute, in a Worker nothing was watching yet.
#
# The duplication is therefore load-bearing rather than untidy. It is the format's rule, not a
# preference, and collapsing it would silently produce a Worker missing everything it needs.

name = "govintel-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# `postgres` and the shared packages use node builtins. Same reason as the web Worker.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging — provisioned 2026-09-01
# ---------------------------------------------------------------------------

[env.staging]
name = "govintel-worker-staging"

[env.staging.vars]
APP_ENV = "staging"

# The same Hyperdrive configuration as the web Worker, and it must be the same one: two
# configurations over one database would be two pools with two independent caches, and the caching
# decision (KI-050) would then have to be right in both places rather than one.
#
# Created with `--caching-disabled`. That flag is a security control, not a performance preference —
# Hyperdrive keys its cache on the query and its parameters, and under RLS two tenants issue
# byte-identical queries while being entitled to different rows. The discriminating input is
# `app.current_organization_id`, which is transaction state rather than a parameter, so a cache
# cannot see it and would serve one tenant's rows to another.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "fa38480586e44cebab20fe15ac2121a0"

# Producer: the drainer publishes claimed rows.
[[env.staging.queues.producers]]
binding = "OUTBOX_QUEUE"
queue = "govintel-outbox-staging"

# Consumer: the same Worker performs the effects.
#
# `max_retries` is 5 to match MAX_ATTEMPTS in packages/resilience — the two counters bound the same
# thing from opposite ends, and letting them disagree means a row is either abandoned while Queues
# still retries it, or retried after the row says it was abandoned.
[[env.staging.queues.consumers]]
queue = "govintel-outbox-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "govintel-outbox-dlq-staging"

# Every minute. The outbox is the durable record, so this cadence decides *latency* rather than
# whether a side effect happens at all — which is why a minute is comfortable rather than tight.
[env.staging.triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# Production — not provisioned
# ---------------------------------------------------------------------------
#
# Deliberately left without bindings rather than filled with placeholder ids.
#
# A placeholder that looks like an id is the shape that gets deployed by accident; an environment
# with no bindings fails immediately and unmistakably at deploy time. Phase 20 provisions these
# against the production account and fills this section in — see the runbook §6.

[env.production]
name = "govintel-worker-production"

[env.production.vars]
APP_ENV = "production"
