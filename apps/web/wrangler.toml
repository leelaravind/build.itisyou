# Cloudflare Workers configuration for the Next.js application.
#
# Built by `@opennextjs/cloudflare`, which compiles the Next.js server into a Worker. Not Pages:
# every route in the production build is `ƒ (Dynamic)` and the application uses server actions
# throughout, so there is no static surface for Pages and the Edge runtime cannot supply the
# `node:crypto` imports this codebase depends on.
#
# See docs/CLOUDFLARE_DEPLOYMENT_ARCHITECTURE.md for why each binding is here.
#
# ---------------------------------------------------------------------------
# Why every binding is repeated under each environment
# ---------------------------------------------------------------------------
#
# Wrangler environments do **not** inherit top-level bindings. Anything declared above the
# `[env.*]` sections applies to the environment-less deployment and to nothing else, so a Worker
# deployed with `--env staging` against the earlier version of this file would have come up with no
# database, no evidence bucket and no queue — and would have failed on its first request rather than
# at deploy time, which is the worse of the two.
#
# The duplication is the format's rule, not untidiness.

name = "govintel-web"
main = ".open-next/worker.js"

# Pinned rather than floating. A compatibility date is the contract for how the runtime behaves, and
# letting it drift means the runtime can change under a build that was verified against a different
# one.
compatibility_date = "2026-08-01"

# Required. Three modules import `node:crypto` — the schema fingerprint, baseline checksums and
# correlation ids. Rewriting them to WebCrypto would turn synchronous calls into asynchronous ones
# through the whole versioning and baseline path for no benefit.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging — provisioned 2026-09-01
# ---------------------------------------------------------------------------

[env.staging]
name = "govintel-web-staging"

[env.staging.vars]
APP_ENV = "staging"

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[env.staging.observability]
enabled = true

# PostgreSQL, through Hyperdrive.
#
# Hyperdrive pools connections for a runtime that cannot hold a pool itself, and presents an ordinary
# Postgres connection string — which is why nothing in `lib/server/database.ts` knows Cloudflare is
# here.
#
# **Query caching is disabled**, set when the configuration was created rather than in this file:
#
#     wrangler hyperdrive create govintel-staging --caching-disabled --connection-string="postgres://..."
#
# The reason is KI-050. Hyperdrive keys its cache on the query and its parameters, and under
# row-level security two tenants issue byte-identical queries while being entitled to different rows
# — the discriminating input is `app.current_organization_id`, which is transaction state rather than
# a parameter. A cache that cannot see it would serve one tenant's rows to another.
#
# Local development supplies a connection string through an environment variable rather than a
# `localConnectionString` key here:
#
#   WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://...
#
# The secret scanner rejected the inline form and was right to: a DSN with inline credentials
# committed to the repository is the exact shape that later gets edited to hold a real one, and by
# then it is in the history.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "fa38480586e44cebab20fe15ac2121a0"

# Evidence storage.
#
# R2 with presigned reads rather than a public bucket. §35 requires randomised keys, no
# user-controlled object paths, signed download URLs and content-disposition safety; a private bucket
# gives all four. There is deliberately no public bucket binding — adding one would make every other
# control decorative.
[[env.staging.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "govintel-evidence-staging"

# Outbox queue — producer side only.
#
# The web Worker writes *outbox rows*, inside the transaction carrying the domain change (§47). It
# does not publish to the queue directly: publishing from a request would reintroduce the race the
# outbox exists to remove, where the change commits, the publish does not, and nothing fails.
#
# The binding is here for the one legitimate case — nudging the drainer after a change, so a side
# effect does not wait for the next cron tick. The drainer remains the only thing that decides what
# has actually been published.
[[env.staging.queues.producers]]
binding = "OUTBOX_NUDGE"
queue = "govintel-outbox-staging"

# ---------------------------------------------------------------------------
# Production — not provisioned
# ---------------------------------------------------------------------------
#
# Deliberately left without bindings rather than filled with placeholder ids. A placeholder that
# looks like an id is the shape that gets deployed by accident; an environment with no bindings fails
# immediately and unmistakably. Phase 20 fills this in — see the runbook §6.

[env.production]
name = "govintel-web-production"

[env.production.vars]
APP_ENV = "production"

# Secrets are never in this file. Set with `wrangler secret put --env staging`:
#   SESSION_SECRET    — guest session signing key
#   APP_VERSION       — set by CI at build time
#   APP_COMMIT        — set by CI at build time
#
# DATABASE_URL is deliberately **not** a secret here. It comes from the Hyperdrive binding at
# runtime; storing a second copy as a secret would let the two disagree, and the copy that is easier
# to edit is the one that would end up pointing somewhere else.
