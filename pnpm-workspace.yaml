packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency postinstall scripts by default, which is a good supply-chain default.
# esbuild is allowed explicitly because Vite (via Vitest) and drizzle-kit both need its platform
# binary. Nothing else in the tree is granted script execution - each addition here is a deliberate
# decision to run third-party code at install time.
allowBuilds:
  esbuild: true
  # workerd ships a prebuilt binary fetched by its install script. Without it wrangler cannot run a
  # Worker locally, which is how the Cloudflare build is verified before it reaches an account.
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260901.1'
